name: Build Edin Feed APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EdinFeed-Android-v1.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Edin Feed
        run: |
          unzip -q EdinFeed-Android-v1.zip -d extracted
          cp -R extracted/EdinFeed/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > gradle.properties

      - name: Fix Kotlin dependency conflict
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdinFeed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
