name: Build Edin Feed V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "EdinFeed-Android-v3.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Edin Feed V3
        run: |
          unzip -q EdinFeed-Android-v3.zip -d extracted
          cp -R extracted/EdinFeedV3/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build V3 APK
        run: gradle assembleDebug

      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: EdinFeed-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
